[build]
  command = "npm run build"
  publish = "dist"

# service worker и страница всегда проверяются заново — иначе обновления не дойдут до телефона
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# файлы с хэшем в имени не меняются — кэшируем надолго
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
